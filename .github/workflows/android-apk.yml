name: Liveo Android APK

# Solo compila a mano (Actions > Liveo Android APK > Run workflow). Antes corría en cada push
# y llenaba el almacenamiento de artefactos de GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK en una Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Para cambiarla sin tocar el código: Settings > Secrets and variables > Actions > Variables > API_BASE_URL
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://192.168.54.109/Liveo/api' }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.liveo.sports --project-name liveo .

      - name: Configure Android manifest (INTERNET + HTTP local + nombre)
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application\n        android:usesCleartextTraffic="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Liveo"', s, count=1)
          # --- Reproductor integrado: PiP + Chromecast
          if 'supportsPictureInPicture' not in s:
              s = s.replace('<activity', '<activity\n            android:supportsPictureInPicture=\"true\"', 1)
          for perm in ('android.permission.FOREGROUND_SERVICE', 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK'):
              if perm not in s:
                  s = s.replace('<application', '<uses-permission android:name=\"' + perm + '\"/>\n    <application', 1)
          if 'OPTIONS_PROVIDER_CLASS_NAME' not in s:
              cast = ('    <meta-data android:name=\"com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME\"'
                      ' android:value=\"com.felnanuke.google_cast.GoogleCastOptionsProvider\"/>\n'
                      '        <service android:name=\"com.google.android.gms.cast.framework.media.MediaNotificationService\"'
                      ' android:exported=\"false\" android:foregroundServiceType=\"mediaPlayback\"/>\n    ')
              s = s.replace('</application>', cast + '</application>', 1)
          p.write_text(s, encoding='utf-8')
          assert 'android.permission.INTERNET' in s, 'Falta permiso INTERNET'
          assert 'usesCleartextTraffic' in s, 'Falta usesCleartextTraffic'
          assert 'supportsPictureInPicture' in s, 'Falta supportsPictureInPicture'
          assert 'OPTIONS_PROVIDER_CLASS_NAME' in s, 'Falta el proveedor de Cast'
          print(s)
          PY

      - name: Apply Liveo branding (icono + arranque oscuro)
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          src = pathlib.Path('branding/android/res')
          dst = pathlib.Path('android/app/src/main/res')
          assert src.is_dir(), 'Falta app/branding/android/res'
          shutil.copytree(src, dst, dirs_exist_ok=True)
          bg = '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><color android:color="#FF070B14"/></item>
          </layer-list>
          '''
          for d in ('drawable', 'drawable-v21'):
              f = dst / d / 'launch_background.xml'
              if f.exists():
                  f.write_text(bg, encoding='utf-8')
          print(sorted(x.name for x in dst.glob('mipmap-*')))
          PY

      - name: Apply native MainActivity (PiP + pantalla encendida)
        run: |
          python3 - <<'PY'
          import glob, pathlib, re
          tpl = pathlib.Path('native/MainActivity.kt.tpl').read_text(encoding='utf-8')
          files = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True)
          assert files, 'No se encontró MainActivity.kt generado por flutter create'
          f = pathlib.Path(files[0])
          m = re.search(r'^package\s+([\w.]+)', f.read_text(encoding='utf-8'), re.M)
          assert m, 'MainActivity.kt sin package'
          f.write_text(tpl.replace('__PKG__', m.group(1)), encoding='utf-8')
          print('MainActivity instalado en', f)
          PY

      - name: Subir compileSdk a 37 (lo exige permission_handler_android)
        run: |
          python3 - <<'PY'
          import pathlib, re
          done = False
          for name in ('build.gradle.kts', 'build.gradle'):
              f = pathlib.Path('android/app') / name
              if not f.is_file():
                  continue
              s = f.read_text(encoding='utf-8')
              repl = 'compileSdk = 37' if name.endswith('.kts') else 'compileSdk 37'
              s2, n = re.subn(r'^(\s*)compileSdk(?:Version)?\b[^\n]*$', lambda m: m.group(1) + repl, s, count=1, flags=re.M)
              if n == 0:
                  s2, n = re.subn(r'^(\s*android\s*\{)', lambda m: m.group(1) + '\n    ' + repl, s, count=1, flags=re.M)
              assert n == 1, 'No se pudo fijar compileSdk en ' + name
              f.write_text(s2, encoding='utf-8')
              print(name, '-> compileSdk 37')
              done = True
          assert done, 'No se encontró android/app/build.gradle(.kts)'
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Corregir plugins antiguos sin namespace (Gradle 8)
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          from urllib.parse import urlparse, unquote
          cfg = json.load(open('.dart_tool/package_config.json', encoding='utf-8'))
          fixed = []
          for pkg in cfg.get('packages', []):
              root = pkg.get('rootUri', '')
              if root.startswith('file://'):
                  base = pathlib.Path(unquote(urlparse(root).path))
              else:
                  base = (pathlib.Path('.dart_tool') / unquote(root)).resolve()
              android = base / 'android'
              gradle = None
              for name in ('build.gradle', 'build.gradle.kts'):
                  if (android / name).is_file():
                      gradle = android / name
                      break
              if gradle is None:
                  continue
              text = gradle.read_text(encoding='utf-8')
              if re.search(r'^\s*namespace\b', text, re.M):
                  continue
              manifest = android / 'src' / 'main' / 'AndroidManifest.xml'
              if not manifest.is_file():
                  continue
              mtext = manifest.read_text(encoding='utf-8')
              m = re.search(r'package\s*=\s*"([^"]+)"', mtext)
              if not m:
                  continue
              ns = m.group(1)
              line = '    namespace = "%s"' % ns if gradle.suffix == '.kts' else '    namespace "%s"' % ns
              new, n = re.subn(r'^(\s*android\s*\{)', lambda mm: mm.group(1) + '\n' + line, text, count=1, flags=re.M)
              if n:
                  gradle.write_text(new, encoding='utf-8')
                  manifest.write_text(re.sub(r'\s+package\s*=\s*"[^"]*"', '', mtext, count=1), encoding='utf-8')
                  fixed.append((pkg.get('name'), ns))
          print('Plugins corregidos:', fixed or 'ninguno hacía falta')
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests (informativo)
        continue-on-error: true
        run: flutter test

      - name: Desactivar lint vital de Gradle
        working-directory: .
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/disable-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital')) {
                t.enabled = false
              }
            }
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      # El APK se publica en una Release (no cuenta en el cupo de artefactos de Actions).
      - name: Publish APK in a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          APK="$RUNNER_TEMP/Liveo-$VER.apk"
          cp "$GITHUB_WORKSPACE/app/build/app/outputs/flutter-apk/app-release.apk" "$APK"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VER" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VER" "$APK" --repo "$GITHUB_REPOSITORY" \
              --title "Liveo $VER" --notes "APK de Liveo $VER (compilado en GitHub Actions)." \
              --target "$GITHUB_SHA"
          fi

      # Copia como artefacto: si el cupo de GitHub está lleno, no hace fallar la compilación.
      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Liveo-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 2
